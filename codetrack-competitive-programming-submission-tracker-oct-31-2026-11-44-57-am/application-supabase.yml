# Supabase Free Tier Profile
# NOTE: Use the Supabase transaction pooler URL (port 6543) or the session pooler.
# When using the transaction pooler, prepareThreshold=0 MUST be appended to the JDBC URL:
# Example: jdbc:postgresql://aws-0-[region].pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      pool-name: SupabaseHikariPool
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
