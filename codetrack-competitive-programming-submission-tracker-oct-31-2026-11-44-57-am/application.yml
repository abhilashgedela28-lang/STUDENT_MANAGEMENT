server:
  port: ${PORT:8080}

spring:
  application:
    name: codetrack
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/codetrack}
    username: ${DB_USERNAME:codetrack}
    password: ${DB_PASSWORD:codetrack}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

codetrack:
  admin:
    email: ${ADMIN_EMAIL:admin@codetrack.dev}
    password: ${ADMIN_PASSWORD:Admin@123}
  sync:
    cooldown-seconds: 45
    daily-cap: 50
    cache-ttl-seconds: 90
    codeforces-throttle-ms: 2100
    leetcode-throttle-ms: 1000
