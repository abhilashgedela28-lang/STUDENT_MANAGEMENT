version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: codetrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: codetrack
      POSTGRES_USER: codetrack
      POSTGRES_PASSWORD: codetrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codetrack -d codetrack"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
