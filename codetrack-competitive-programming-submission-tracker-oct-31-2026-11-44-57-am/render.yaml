services:
  - type: web
    name: codetrack
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: NODE_ENV=production npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CODETRACK_DATA_DIR
        value: /data
    disk:
      name: codetrack-data
      mountPath: /data
      sizeGB: 1
